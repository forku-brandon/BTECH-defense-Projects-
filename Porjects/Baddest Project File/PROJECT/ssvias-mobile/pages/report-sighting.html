<!-- pages/report-sighting.html - Report Sighting -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Report Sighting - SSVIAS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="mobile-container">
        <div class="status-bar">
            <span>👁️ Report Sighting</span>
            <span>Citizen Alert</span>
        </div>
        
        <div class="header">
            <h1>👁️ Report Vehicle Sighting</h1>
            <p>Help recover stolen vehicles</p>
            <div class="cameroon-flag"></div>
        </div>
        
        <div class="main-content">
            <div id="alert" class="alert"></div>
            
            <div class="card">
                <div class="card-title">Sighting Information</div>
                <form id="sighting-form">
                    <div class="form-group">
                        <label>🚗 License Plate Number *</label>
                        <input type="text" id="plate-number" placeholder="AB123CD" required>
                        <button type="button" class="btn btn-secondary" style="margin-top: 5px;" onclick="openCamera((plate) => {
                            document.getElementById('plate-number').value = plate;
                            checkVehicleStatus(plate);
                        })">📷 Scan Plate</button>
                    </div>
                    
                    <div id="vehicle-status-display"></div>
                    
                    <div class="form-group">
                        <label>📍 Current Location *</label>
                        <input type="text" id="location" placeholder="Where did you see the vehicle?" required>
                        <button type="button" class="btn btn-secondary" style="margin-top: 5px;" onclick="getCurrentLocation()">📍 Use Current Location</button>
                    </div>
                    
                    <div class="form-group">
                        <label>📅 Date & Time Seen *</label>
                        <input type="datetime-local" id="sighting-date" required>
                    </div>
                    
                    <div class="form-group">
                        <label>📝 Additional Details</label>
                        <textarea id="details" rows="4" placeholder="Direction of travel, suspicious activity, number of occupants, etc."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>📸 Photo Evidence</label>
                        <input type="file" id="photo" accept="image/*">
                        <button type="button" class="btn btn-secondary" style="margin-top: 5px;" onclick="capturePhoto()">📷 Take Photo</button>
                    </div>
                    
                    <div class="form-group">
                        <label>👤 Your Name (Optional)</label>
                        <input type="text" id="reporter-name" placeholder="For authorities to contact you">
                    </div>
                    
                    <div class="form-group">
                        <label>📱 Your Phone (Optional)</label>
                        <input type="tel" id="reporter-phone" placeholder="For updates">
                    </div>
                    
                    <button type="submit" class="btn btn-warning">🚨 Submit Sighting Report</button>
                </form>
            </div>
            
            <div class="card">
                <div class="card-title">⚠️ Safety Tips</div>
                <ul style="padding-left: 20px;">
                    <li>Do not approach suspicious vehicles</li>
                    <li>Keep a safe distance</li>
                    <li>Note vehicle direction and time</li>
                    <li>Contact police immediately if in danger</li>
                </ul>
            </div>
        </div>
        
        <div class="bottom-nav">
            <a href="../index.html" class="nav-item">🏠 Home</a>
            <a href="verify-vehicle.html" class="nav-item">🔍 Verify</a>
            <a href="report-sighting.html" class="nav-item active">🚨 Report</a>
        </div>
    </div>
    
    <!-- Camera Modal -->
    <div id="camera-modal" class="camera-modal">
        <div class="camera-container">
            <video id="camera-feed" autoplay playsinline></video>
            <div class="camera-controls">
                <button id="capture-btn" class="camera-btn">📸</button>
            </div>
            <button id="close-camera" class="close-camera">✕ Close</button>
        </div>
    </div>
    
    <script>
        async function checkVehicleStatus(plate) {
            const result = await API.verifyVehicle(plate);
            const display = document.getElementById('vehicle-status-display');
            
            if (result.success && result.vehicle) {
                if (result.vehicle.status === 'stolen') {
                    display.innerHTML = `
                        <div class="alert alert-danger">
                            ⚠️ ALERT: This vehicle is REPORTED STOLEN!<br>
                            Please provide as much detail as possible.
                        </div>
                    `;
                } else {
                    display.innerHTML = `
                        <div class="alert alert-info">
                            ℹ️ This vehicle is not reported stolen, but you can still report suspicious activity.
                        </div>
                    `;
                }
            }
        }
        
        async function getCurrentLocation() {
            try {
                const position = await getCurrentLocation();
                const location = await getLocationAddress(position.lat, position.lng);
                document.getElementById('location').value = location;
                showAlert('Location captured!', 'success');
            } catch (error) {
                showAlert('Unable to get location. Please enter manually.', 'danger');
            }
        }
        
        function capturePhoto() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        localStorage.setItem('sightingPhoto', evt.target.result);
                        showAlert('Photo captured successfully!', 'success');
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }
        
        document.getElementById('sighting-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const plateNumber = document.getElementById('plate-number').value.toUpperCase();
            
            const sightingData = {
                plate_number: plateNumber,
                location: document.getElementById('location').value,
                sighting_date: document.getElementById('sighting-date').value,
                details: document.getElementById('details').value,
                reporter_name: document.getElementById('reporter-name').value,
                reporter_phone: document.getElementById('reporter-phone').value
            };
            
            if (!sightingData.plate_number || !sightingData.location || !sightingData.sighting_date) {
                showAlert('Please fill in all required fields', 'danger');
                return;
            }
            
            showAlert('Submitting sighting report...', 'info');
            const result = await API.reportSighting(sightingData);
            
            if (result.success) {
                showAlert('Sighting reported! Authorities have been notified.', 'success');
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 3000);
            } else {
                showAlert('Failed to submit report. Please try again.', 'danger');
            }
        });
        
        // Set default datetime to now
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('sighting-date').value = now.toISOString().slice(0, 16);
    </script>
    <script src="../js/api.js"></script>
    <script src="../js/ocr.js"></script>
    <script src="../js/camera.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
