<!-- pages/register.html - User Registration Page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Register - SSVIAS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="mobile-container">
        <div class="status-bar">
            <span>📝 Registration</span>
            <span>Join SSVIAS</span>
        </div>
        
        <div class="header">
            <h1>Create Account</h1>
            <p>Help fight vehicle theft in Cameroon</p>
            <div class="cameroon-flag"></div>
        </div>
        
        <div class="main-content">
            <div id="alert" class="alert"></div>
            
            <div class="card">
                <div class="card-title">Personal Information</div>
                <form id="register-form">
                    <div class="form-group">
                        <label>👤 Full Name</label>
                        <input type="text" id="fullname" placeholder="John Doe" required>
                    </div>
                    
                    <div class="form-group">
                        <label>📧 Email Address</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label>📱 Phone Number</label>
                        <input type="tel" id="phone" placeholder="677123456" required>
                        <small>Cameroon format: 6XXXXXXX or 2XXXXXXX</small>
                    </div>
                    
                    <div class="form-group">
                        <label>🏢 Region</label>
                        <select id="region" required>
                            <option value="">Select Region</option>
                            <option value="Adamawa">Adamawa</option>
                            <option value="Centre">Centre (Yaoundé)</option>
                            <option value="East">East</option>
                            <option value="Far North">Far North</option>
                            <option value="Littoral">Littoral (Douala)</option>
                            <option value="North">North</option>
                            <option value="North West">North West (Bamenda)</option>
                            <option value="West">West</option>
                            <option value="South">South</option>
                            <option value="South West">South West (Buea)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>🔒 Password</label>
                        <input type="password" id="password" placeholder="Minimum 6 characters" required>
                    </div>
                    
                    <div class="form-group">
                        <label>🔒 Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                    </div>
                    
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="terms" required>
                            I agree to the <a href="#">Terms and Conditions</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Register Now</button>
                </form>
            </div>
        </div>
        
        <div class="bottom-nav">
            <a href="../index.html" class="nav-item">🏠 Home</a>
            <a href="verify-vehicle.html" class="nav-item">🔍 Verify</a>
            <a href="login.html" class="nav-item">👤 Login</a>
        </div>
    </div>
    
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (password !== confirmPassword) {
                showAlert('Passwords do not match!', 'danger');
                return;
            }
            
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters', 'danger');
                return;
            }
            
            const userData = {
                name: document.getElementById('fullname').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                region: document.getElementById('region').value,
                password: password,
                role: 'citizen'
            };
            
            showAlert('Creating account...', 'info');
            const result = await API.register(userData);
            
            if (result.success) {
                showAlert('Registration successful! Please login.', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                showAlert('Registration failed. Please try again.', 'danger');
            }
        });
    </script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
